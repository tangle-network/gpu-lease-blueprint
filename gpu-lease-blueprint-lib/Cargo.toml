[package]
name = "gpu-lease-blueprint-lib"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true

[features]
cloud = ["blueprint-sdk/remote-providers", "tokio/time", "dep:chrono"]

[dependencies]
chrono = { workspace = true, optional = true }
blueprint-sdk = { workspace = true, features = ["std", "tracing", "macros", "tangle", "local-store", "tee"] }
hex = "0.4"
fs2 = "0.4"
futures-util = { version = "0.3", features = ["sink"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiny-keccak = { version = "2", features = ["keccak"] }
tokio = { version = "1", default-features = false, features = ["sync", "rt"] }
tracing = "0.1"

[dev-dependencies]
anyhow = "1"
tower = { version = "0.5", features = ["util"] }
base64 = "0.22"
blueprint-anvil-testing-utils = { version = "=0.2.2" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
