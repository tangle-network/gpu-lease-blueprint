[package]
name = "gpu-lease-blueprint-lib"
version = "0.1.0"
edition.workspace = true
authors.workspace = true
description.workspace = true
license.workspace = true

[dependencies]
blueprint-sdk = { version = "=0.2.0-alpha.12", default-features = false, features = ["std", "tracing", "macros", "tangle", "local-store"] }
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tiny-keccak = { version = "2", features = ["keccak"] }
tokio = { version = "1", default-features = false, features = ["sync", "rt"] }
tracing = "0.1"

[dev-dependencies]
anyhow = "1"
alloy-rpc-types = "1.8"
blueprint-anvil-testing-utils = { version = "=0.2.0-alpha.12" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
