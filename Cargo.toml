[workspace]
resolver = "3"
members = [
    "gpu-lease-blueprint-lib",
    "gpu-lease-blueprint-bin",
]

[workspace.package]
authors = ["Tangle Network"]
edition = "2024"
description = "GPU Lease Blueprint — escrowed GPU leases on Tangle (SPEC.md is design law)"
license = "MIT OR Apache-2.0"

[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = 1

# Pin the Blueprint SDK graph to the release that carries the 0.19 bindings
# and removes the legacy EigenLayer dependency path (same pin as
# ai-agent-sandbox-blueprint — proven to resolve+compile on this machine).
