[workspace]
resolver = "3"
members = [
    "gpu-lease-blueprint-lib",
    "gpu-lease-blueprint-bin",
    "gpu-lease-blueprint-gen",
]

[workspace.package]
authors = ["Tangle Network"]
edition = "2024"
description = "GPU Lease Blueprint — escrowed GPU leases on Tangle (SPEC.md is design law)"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
chrono = "0.4"
blueprint-sdk = { version = "=0.3.0", default-features = false }
blueprint-chain-setup-anvil = { version = "=0.2.2" }

[profile.dev]
split-debuginfo = "unpacked"

[profile.dev.package."*"]
debug = 1
